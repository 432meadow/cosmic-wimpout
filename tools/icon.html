<!doctype html>
<html><head><meta charset="utf-8"><title>icon</title>
<style>
  html, body { margin: 0; background: #1a0f2e; overflow: hidden; }
  canvas { width: 100vw; height: 100vw; image-rendering: pixelated; display: block; }
</style></head>
<body>
<canvas id="c" width="64" height="64"></canvas>
<script src="../src/art.js"></script>
<script>
/* App icon, built from the Sun-Star face on the actual Sun Cube so the icon and
   the game can never drift apart. 64 logical px divides 512 and 192 exactly.
   Content sits inside the middle 75% to survive maskable/circular cropping. */
const ctx = document.getElementById('c').getContext('2d');
const P = CW.PALETTES.cosmic;

ctx.fillStyle = P[0];
ctx.fillRect(0, 0, 64, 64);

// faint corona wash so the icon is not a flat field at small sizes
ctx.fillStyle = P[1];
for (let y = 0; y < 64; y++) {
  for (let x = 0; x < 64; x++) {
    const d = Math.hypot(x - 31.5, y - 31.5);
    if (d > 22 && d < 30 && ((x * 7 + y * 5) % 11 === 0)) ctx.fillRect(x, y, 1, 1);
  }
}

const rows = CW.FACES.S;                 // 24x24, drawn at 2x -> 48x48
ctx.fillStyle = P[3];
for (let r = 0; r < 24; r++) {
  for (let i = 0; i < 24; i++) {
    if (rows[r][i] !== '.') ctx.fillRect(8 + i * 2, 8 + r * 2, 2, 2);
  }
}
document.title = 'ready';
</script>
</body></html>
